<script>
const input = document.getElementById("recherche");
const liens = document.querySelectorAll(".grille a");

input.addEventListener("input", () => {
const texte = input.value.toLowerCase().trim();
liens.forEach((lien) => {
const visible = lien.textContent.toLowerCase().includes(texte);
lien.style.display = visible ? "flex" : "none";
});
});
